# Escribe las tasas adentro del index.html para que Google las vea sin ejecutar
# JavaScript (ver el comentario largo al principio de construir-datos.mjs).
#
# Corre solo cada 2 horas y también a mano (botón "Run workflow" en la pestaña Actions).
# Primera corrida manual revisada con Marc el 2026-10-27: todo bien, horario activado.
name: Actualizar datos de Tasita

on:
  workflow_dispatch:            # botón para correrlo a mano desde GitHub
  schedule:
    - cron: '17 */2 * * *'      # cada 2 horas (la hora de GitHub es UTC)
  # Para que, si se edita index.html a mano (por ejemplo una tasa de una billetera), vuelva a
  # escribir los datos sin esperar a la próxima vuelta, se pueden descomentar estas 3 líneas:
  # push:
  #   branches: [master]
  #   paths: ['index.html']

permissions:
  contents: write    # guardar index.html y datos-tasita.json
  pages: write       # pedir la publicación

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Argentina/Buenos_Aires    # "hoy" tiene que ser hoy en Argentina, no en UTC
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar lo necesario
        run: npm ci

      - name: Construir los datos
        run: node construir-datos.mjs

      - name: Rearmar las páginas de cada sección con esos datos
        # Cada sección (/plazos-fijos/, /letras/…) lleva su propia tabla. Se arman a partir de
        # datos-tasita.json, o sea de datos que ya pasaron todas las validaciones.
        run: node construir-secciones.mjs

      - name: Guardar SOLO si algo cambió
        id: guardar
        env:
          ARCHIVOS: index.html datos-tasita.json billeteras plazos-fijos plazos-fijos-uva letras dolar billeteras-dolares brokers presupuesto
        run: |
          git add -N $ARCHIVOS
          if git diff --quiet -- $ARCHIVOS; then
            echo "Los datos son los mismos: no se guarda nada ni se publica nada."
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Tasita datos (automático)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $ARCHIVOS
            git commit -m "Datos actualizados"
            git push || (git pull --rebase && git push)
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Pedir la publicación
        if: steps.guardar.outputs.cambio == 'si'
        # Un cambio guardado por un robot a veces no dispara solo la publicación de
        # GitHub Pages: se la pide a mano para no depender de eso.
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir; GitHub la hace igual en unos minutos."
